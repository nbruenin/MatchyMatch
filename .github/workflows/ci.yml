name: Forge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # TEMPORARY: CI-observation test only. Remove this step.
      - name: "TEMPORARY - sleep 120 (CI observation test, remove me)"
        run: sleep 120

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
