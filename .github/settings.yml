# .github/settings.yml
# GitHub Repository Settings
# Compatible with the "Safe Settings" Probot app
# https://github.com/github/safe-settings
#
# Even without the app, this file serves as the authoritative
# source-of-truth for all repository security settings.

repository:
  name: MatchyMatch
  description: A matching card game built with React
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false      # enforce linear history
  allow_rebase_merge: true
  allow_auto_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# ---------------------------------------------------------------------------
# Branch protection rules
# ---------------------------------------------------------------------------
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        require_last_push_approval: true
        dismissal_restrictions:
          users: []
          teams: []
      required_status_checks:
        strict: true          # branch must be up-to-date before merging
        contexts:
          - '🔍 Lint'
          - '🧪 Test'
          - '🏗️ Build'
          - 'verify-remote'
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      lock_branch: false

# ---------------------------------------------------------------------------
# Collaborators & teams  (add as needed)
# ---------------------------------------------------------------------------
collaborators: []

# ---------------------------------------------------------------------------
# Labels
# ---------------------------------------------------------------------------
labels:
  - name: 'bug'
    color: 'd73a4a'
    description: Something isn't working
  - name: 'enhancement'
    color: 'a2eeef'
    description: New feature or request
  - name: 'security'
    color: 'e4e669'
    description: Security-related issue or fix
  - name: 'dependencies'
    color: '0075ca'
    description: Pull requests that update a dependency file
  - name: 'npm'
    color: 'cb0000'
    description: npm dependency update
  - name: 'ci'
    color: '006b75'
    description: CI/CD related change
  - name: 'github-actions'
    color: '000000'
    description: GitHub Actions workflow change
  - name: 'documentation'
    color: '0075ca'
    description: Improvements or additions to documentation
  - name: 'good first issue'
    color: '7057ff'
    description: Good for newcomers
  - name: 'help wanted'
    color: '008672'
    description: Extra attention is needed
  - name: 'wontfix'
    color: 'ffffff'
    description: This will not be worked on
